<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Website with Animated Background</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            height: 100px;
            align-items: center;
        }

        nav h1 {
            font-size: 2.6em;
            position: relative;
            cursor: pointer;
            letter-spacing: 4px;
            text-decoration: none;
            color: #fff;
        }

        nav h1 span {
            color: #c513cb;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            position: relative;
            font-size: 1.5em;
            font-weight: 400;
            padding: 12px 18px;
            cursor: pointer;
            overflow: hidden;
        }

        nav ul li:hover {
            color: #ff006f;
        }

        nav ul li::after {
            content: '';
            position: absolute;
            bottom: 5px;
            width: 0%;
            height: 3px;
            left: 50%;
            background: #00bfff;
            transform: translateX(-50%);
            transition: .3s;
        }

        nav ul li:hover::after {
            width: 80%;
        }

        .start-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 100px);
            text-align: center;
        }

        .textBox h1 {
            font-size: 3.4em;
        }

        .textBox h1 span {
            color: #fbf8f8;
            font-size: 5em;
        }

        .textBox p {
            font-size: 2.2em;
            margin: 20px 0;
        }

        .start-btn {
            font-family: 'Poppins';
            padding: 8px 18px;
            font-size: 26px;
            background-color: transparent;
            color: #f8f8f8;
            border: 3px solid #f8f8f8;
            border-radius: 4px;
            cursor: pointer;
            transition: .3s;
            font-weight: 600;
        }

        .start-btn:hover {
            background-color: #f8f8f8;
            color: #000;
        }

        .bgAnimation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(20,1fr);
            grid-template-rows: repeat(20,1fr);
            background: #1d1d1d;
            filter: saturate(2);
            overflow: hidden;
        }

        .colorBox {
            z-index: 2;
            filter: brightness(1.1);
            transition: 2s ease;
            position: relative;
            margin: 2px;
            background: #1d1d1d;
        }

        .colorBox:hover {
            background: #ff006f;
            transition-duration: 0s;
        }

        .backgroundAnim {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: #0015ff;
            filter: blur(60px);
            animation: animBack 6s linear infinite;
        }

        @keyframes animBack {
            0% { top: -60px; }
            100% { top: 120%; }
        }

        .quiz-container {
            display: none;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .quiz-container.active {
            display: block;
        }

        .question {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #fff;
        }

        .options {
            display: grid;
            gap: 10px;
        }

        .option {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            font-size: 1.1em;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .option.correct {
            background: rgba(46, 204, 113, 0.3);
            border-color: #2ecc71;
        }

        .option.wrong {
            background: rgba(231, 76, 60, 0.3);
            border-color: #e74c3c;
        }

        .quiz-footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress {
            color: #fff;
            font-size: 1.1em;
        }

        .next-btn {
            padding: 10px 20px;
            background: #c513cb;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        .next-btn:hover {
            background: #a010a7;
        }

        .next-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .result-container {
            text-align: center;
            display: none;
        }

        .result-container.active {
            display: block;
        }

        .score {
            font-size: 2em;
            margin: 20px 0;
        }

        .restart-btn {
            padding: 10px 20px;
            background: #c513cb;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            background: #a010a7;
        }
    </style>
</head>
<body>
    <div class="bgAnimation" id="bgAnimation">
        <div class="backgroundAnim"></div>
    </div>

    <div class="container">
        <nav>
            <h1><span>Google </span><span>Developers</span><span> Group</span></h1>
            <ul>
                <li>Contact us</li>
            </ul>
        </nav>

        <div class="start-screen" id="startScreen">
            <div class="textBox">
                <h1><span>QuIz</span></h1>
                <p>Test Your Knowledge, Unlock Your Potential!</p>
                <button class="start-btn" id="startBtn">Start QuIz</button>
            </div>
        </div>

        <div class="quiz-container" id="quizContainer">
            <div class="question" id="question"></div>
            <div class="options" id="options"></div>
            <div class="quiz-footer">
                <div class="progress" id="progress"></div>
                <button class="next-btn" id="nextBtn" disabled>Next Question</button>
            </div>
        </div>

        <div class="result-container" id="resultContainer">
            <h2>Quiz Complete!</h2>
            <div class="score" id="score"></div>
            <button class="restart-btn" id="restartBtn">Try Again</button>
        </div>
    </div>

    <script>
        // Background Animation
        const bgAnimation = document.getElementById('bgAnimation');
        const numberOfColorBoxes = 400;

        for (let i = 0; i < numberOfColorBoxes; i++) {
            const colorBox = document.createElement('div');
            colorBox.classList.add('colorBox');
            bgAnimation.appendChild(colorBox);
        }

        // Quiz Logic
        const quizData = [
            {
                question: "What is the capital of France?",
                options: ["London", "Berlin", "Paris", "Madrid"],
                correct: 2
            },
            {
                question: "Which planet is known as the Red Planet?",
                options: ["Earth", "Mars", "Venus", "Jupiter"],
                correct: 1
            },
            {
                question: "Who painted the Mona Lisa?",
                options: ["Vincent Van Gogh", "Pablo Picasso", "Leonardo da Vinci", "Michelangelo"],
                correct: 2
            },
            {
                question: "What is the largest ocean on Earth?",
                options: ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean", "Pacific Ocean"],
                correct: 3
            },
            {
                question: "Which element has the chemical symbol 'O'?",
                options: ["Gold", "Oxygen", "Osmium", "Oganesson"],
                correct: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedOption = null;

        const startScreen = document.getElementById('startScreen');
        const quizContainer = document.getElementById('quizContainer');
        const resultContainer = document.getElementById('resultContainer');
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const progressEl = document.getElementById('progress');
        const nextBtn = document.getElementById('nextBtn');
        const scoreEl = document.getElementById('score');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        function startQuiz() {
            startScreen.style.display = 'none';
            quizContainer.classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            selectedOption = null;
            nextBtn.disabled = true;
            
            const currentQuizData = quizData[currentQuestion];
            questionEl.textContent = currentQuizData.question;
            
            optionsEl.innerHTML = '';
            currentQuizData.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option';
                button.textContent = option;
                button.onclick = () => selectOption(index);
                optionsEl.appendChild(button);
            });

            progressEl.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        }

        function selectOption(index) {
            if (selectedOption !== null) return;
            
            selectedOption = index;
            const correct = quizData[currentQuestion].correct;
            
            const options = optionsEl.getElementsByClassName('option');
            options[index].classList.add(index === correct ? 'correct' : 'wrong');
            
            if (index === correct) score++;
            
            for (let option of options) {
                option.disabled = true;
            }
            
            nextBtn.disabled = false;
        }

        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizContainer.classList.remove('active');
            resultContainer.classList.add('active');
            scoreEl.textContent = `Your Score: ${score} out of ${quizData.length}`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            selectedOption = null;
            resultContainer.classList.remove('active');
            quizContainer.classList.add('active');
            loadQuestion();
        }

        startBtn.addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', restartQuiz);
    </script>
</body>
</html>
